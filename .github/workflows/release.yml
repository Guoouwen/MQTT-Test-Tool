name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Validate versions
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = ([regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if ($pkg -ne $tag -or $tauri -ne $tag -or $cargo -ne $tag) {
            throw "版本不一致: tag=v$tag, package.json=$pkg, tauri.conf.json=$tauri, Cargo.toml=$cargo"
          }
          Write-Host "版本校验通过: v$tag"

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Normalize artifacts
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $base = "MQTT-Test-Tool_${ver}_x64"

          # 1) 安装包：Tauri 会把 productName 中的空格转成点，统一改成连字符命名
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          $setup = "$base-setup.exe"
          Copy-Item $installer.FullName $setup
          Write-Host "安装包: $setup ($([math]::Round($installer.Length/1MB,2)) MB)"

          # 2) 绿色便携版：重命名二进制为规范名后打包 zip
          $exe = 'src-tauri/target/release/mqtt-downlink-tool.exe'
          if (-not (Test-Path $exe)) { throw "未找到 release 二进制" }
          $portableDir = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exe (Join-Path $portableDir 'MQTT-Test-Tool.exe')
          $portable = "$base-portable.zip"
          Compress-Archive -Path (Join-Path $portableDir 'MQTT-Test-Tool.exe') -DestinationPath $portable
          Write-Host "便携版: $portable"

          Write-Output "setup=$setup" >> $env:GITHUB_ENV
          Write-Output "portable=$portable" >> $env:GITHUB_ENV

      - name: Create release and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = $env:setup
          $portable = $env:portable
          $notes = @"
          ## MQTT Test Tool `${{ github.ref_name }}

          MQTT 5.0 下行测试工具（Windows x64）。

          ### 下载说明

          | 文件 | 说明 |
          | --- | --- |
          | `$setup` | 安装包，双击安装，自动创建快捷方式 |
          | `$portable` | 绿色便携版，解压后双击 `MQTT-Test-Tool.exe` 即用 |

          > 依赖系统 WebView2（Win10/11 已预装，缺失时会提示安装）。
          "@
          gh release create '${{ github.ref_name }}' $setup $portable `
            --title "MQTT Test Tool ${{ github.ref_name }}" `
            --notes $notes
